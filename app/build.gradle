plugins {
    id 'com.android.application'
}

android {
    namespace 'com.together.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.together.app"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    signingConfigs {
        release {
            storeFile file("../release.jks")
            storeType "JKS"
            storePassword "TogetherKey2026"
            keyAlias "togetherkey"
            keyPassword "TogetherKey2026"
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

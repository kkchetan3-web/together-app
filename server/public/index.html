<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Together</title>
<meta name="color-scheme" content="dark light">
<script>
// Apply saved theme before first paint to avoid a flash of the wrong theme.
(function(){try{var p=localStorage.getItem('together-theme')||'dark';var dark=p==='dark'||(p==='system'&&window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches);document.documentElement.setAttribute('data-theme',dark?'dark':'light');}catch(e){document.documentElement.setAttribute('data-theme','dark');}})();
</script>
<style>
:root{
  color-scheme:dark;
  --bg:#141026;
  --glass:rgba(167,139,250,0.07);
  --glass-strong:rgba(167,139,250,0.14);
  --border:rgba(196,181,253,0.16);
  --text:#F1EDFC;
  --text-muted:#A79EC4;
  --accent:#A78BFA;
  --accent-2:#C4B5FD;
  --brand:#6C5CE7;
  --danger:#F0506E;
  --radius-sm:14px;
  --radius:20px;
  --radius-lg:28px;
  --shadow:0 12px 36px rgba(15,8,40,0.5);
  --shadow-soft:0 4px 24px rgba(15,8,40,0.35);
  --blur:blur(26px) saturate(1.6);
  --grad:linear-gradient(135deg,#A78BFA 0%,#7C6AEF 52%,#6C5CE7 100%);
  --font:'SamsungOne','Samsung Sans','Inter',-apple-system,BlinkMacSystemFont,system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100dvh;width:100vw;overflow:hidden;background:var(--bg);color:var(--text);font-family:var(--font);-webkit-font-smoothing:antialiased}
body{background-image:radial-gradient(circle at 12% 12%,rgba(167,139,250,0.22),transparent 46%),radial-gradient(circle at 88% 88%,rgba(124,106,239,0.18),transparent 46%),radial-gradient(circle at 50% 50%,rgba(64,48,120,0.35),transparent 72%);background-attachment:fixed}
input,button{font-family:inherit;font-size:14px;border-radius:var(--radius-sm);padding:11px 16px;border:1px solid var(--border);background:var(--glass-strong);color:var(--text);outline:none;transition:background .2s ease,transform .15s ease,box-shadow .2s ease,border-color .2s ease}
input::placeholder{color:var(--text-muted)}
input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(167,139,250,0.25)}
button{cursor:pointer;font-weight:600}
button:hover{background:rgba(196,181,253,0.2);transform:translateY(-1px)}
button:active{transform:scale(.97)}
button:disabled{opacity:.45;cursor:default;transform:none}
button.on{background:var(--danger);color:#fff;border-color:transparent}
#create,#join,#chatForm button{background:var(--grad);border:none;color:#fff;font-weight:700;box-shadow:0 8px 22px rgba(108,92,231,0.4),inset 0 1px 0 rgba(255,255,255,0.35)}
#create:hover,#join:hover,#chatForm button:hover{box-shadow:0 10px 26px rgba(108,92,231,0.55),inset 0 1px 0 rgba(255,255,255,0.35)}
#delBtn{color:var(--danger);border-color:rgba(240,80,110,0.35);background:rgba(240,80,110,0.1)}
#delBtn:hover{background:rgba(240,80,110,0.2)}

/* LOBBY */
#lobby{max-width:420px;margin:9vh auto;padding:38px 32px;display:grid;gap:16px;text-align:center;background:var(--glass);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);border:1px solid var(--border);border-radius:var(--radius-lg);box-shadow:var(--shadow);position:relative;z-index:10}
#lobby h1{font-size:34px;font-weight:700;letter-spacing:-0.6px;background:linear-gradient(135deg,#ffffff 25%,var(--accent-2));-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:6px}
.lobby-status{font-size:13px;color:var(--text-muted);min-height:18px}
.lobby-status.ok{color:#7EE2A8}
.lobby-status.error{color:#FF9AAE}

/* APP GRID */
#app{display:none;height:100dvh;grid-template-columns:1fr 360px;gap:12px;padding:12px}
#stage{position:relative;display:flex;flex-direction:column;background:#0b0817;border-radius:var(--radius-lg);overflow:hidden;box-shadow:var(--shadow);min-width:0;border:1px solid var(--border)}
#views{flex:1;display:flex;min-height:0;position:relative}
#views video{width:100%;height:100%;object-fit:contain;background:#0b0817}
#screen{display:none}
#ytWrap{position:absolute;inset:0;display:none;background:#000}
#ytPlayer,#ytWrap iframe{width:100%;height:100%;border:0;display:block}
#ytUnlock{position:absolute;inset:0;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.55);color:#fff;font-size:18px;font-weight:700;cursor:pointer;z-index:5;text-align:center;padding:12px}

/* CONTROL BAR */
#bar{display:flex;align-items:center;gap:6px;padding:10px 12px;background:rgba(24,18,46,0.88);backdrop-filter:blur(18px) saturate(1.5);-webkit-backdrop-filter:blur(18px) saturate(1.5);border-top:1px solid var(--border);flex-wrap:wrap;flex-shrink:0;position:relative}
#bar input[type="text"]{flex:1;min-width:120px;padding:7px 12px;font-size:12px}
#bar input[type="file"]{display:none}
#bar button{padding:7px 12px;font-size:12px}
#upStatus{font-size:11px;color:var(--accent-2);padding:0 4px}
#fileName{font-size:11px;color:var(--text-muted);max-width:120px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:0 4px}
#progWrap{position:absolute;top:0;left:0;right:0;height:3px;background:rgba(255,255,255,0.06);display:none;pointer-events:none;z-index:10}
#progBar{height:100%;width:0%;background:var(--grad);transition:width .2s ease}

/* SIDEBAR */
#side{display:flex;flex-direction:column;background:var(--glass);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);border:1px solid var(--border);border-radius:var(--radius-lg);overflow:hidden;box-shadow:var(--shadow);min-height:0}

/* CALL STATUS */
.call-status{padding:8px 14px;font-size:12px;font-weight:600;color:var(--text-muted);border-bottom:1px solid var(--border);background:rgba(167,139,250,0.06);flex-shrink:0;display:flex;align-items:center;gap:7px}
.call-status::before{content:'';width:8px;height:8px;border-radius:50%;background:var(--text-muted);flex-shrink:0}
.call-status.ok{color:#7EE2A8}.call-status.ok::before{background:#7EE2A8;box-shadow:0 0 8px rgba(126,226,168,.7)}
.call-status.warn{color:#FFC46B}.call-status.warn::before{background:#FFC46B;box-shadow:0 0 8px rgba(255,196,107,.7)}

/* PROFILE CARD */
#profileCard{padding:12px;border-bottom:1px solid var(--border);background:rgba(167,139,250,0.08);display:flex;flex-direction:column;gap:6px;font-size:12px;flex-shrink:0}
.nameRow{display:flex;align-items:center;gap:6px}
.nameLabel{color:var(--text-muted);min-width:45px}
#profileCard input{padding:6px 10px;font-size:12px;flex:1;min-width:0;border-radius:10px}
#profileCard button{padding:6px 10px;font-size:12px;border-radius:10px}
#peerName{color:var(--accent-2);font-weight:600}

/* DUAL VIDEO CALL */
#videoGrid{display:flex;gap:10px;padding:10px;border-bottom:1px solid var(--border);flex-shrink:0;background:rgba(11,8,23,0.35);justify-content:center;align-items:stretch}
.camBox{position:relative;flex:1 1 0;min-width:0;aspect-ratio:16/9;max-height:44dvh;min-height:120px;background:#0b0817;border-radius:var(--radius);overflow:hidden;border:1px solid var(--border);transition:all .3s ease;display:flex;flex-direction:column}
.camBox video{width:100%;height:100%;object-fit:cover}
.camBox.hidden video{display:none}
.camBox.hidden::after{content:"Camera Hidden";display:flex;align-items:center;justify-content:center;height:100%;color:var(--text-muted);font-size:12px;text-align:center}
.camLabel{position:absolute;top:6px;left:8px;z-index:2;font-size:11px;font-weight:600;letter-spacing:.3px;color:#fff;background:rgba(11,8,23,0.6);border:1px solid rgba(196,181,253,0.25);padding:3px 8px;border-radius:999px;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);pointer-events:none}
.camControls{position:absolute;bottom:6px;right:6px;display:flex;gap:6px;z-index:2}
.camControls button{padding:6px 10px;font-size:11px;border-radius:10px;background:rgba(11,8,23,0.75);border:1px solid rgba(196,181,253,0.3);color:#fff}
/* Maximized = fit-to-screen: whole frame visible, correct aspect, nothing cropped */
.camBox.maximized{position:fixed;inset:0;width:100vw;height:100dvh;max-width:none;max-height:none;min-height:0;aspect-ratio:auto;transform:none;isolation:isolate;z-index:99999;border:none;border-radius:0;box-shadow:none;flex:none;background:#000}
.camBox.maximized video{object-fit:contain}
.camBox.maximized .camControls{top:calc(10px + env(safe-area-inset-top,0px));bottom:auto;right:10px}
.camBox.maximized .camControls button{font-size:15px;padding:10px 16px;background:rgba(11,8,23,0.85);border-color:var(--accent)}
.camBox.maximized .camLabel{font-size:14px;top:calc(12px + env(safe-area-inset-top,0px));left:12px}
/* Picture-in-picture: while one camera is maximized, the other floats in a corner */
.camBox.pip{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));right:12px;left:auto;bottom:auto;width:clamp(110px,26vw,240px);aspect-ratio:16/9;max-height:none;min-height:0;flex:none;z-index:100000;border:2px solid var(--accent);border-radius:14px;box-shadow:0 10px 34px rgba(0,0,0,.65);background:#0b0817;cursor:grab;touch-action:none}
.camBox.pip:active{cursor:grabbing}
.camBox.pip video{object-fit:cover}
.camBox.pip .camControls{display:none}
.camBox.pip .camLabel{font-size:10px;top:4px;left:6px;padding:2px 6px}
.camBox.pip.hidden::after{font-size:10px}
#maxBackdrop{display:none;position:fixed;inset:0;background:rgba(11,8,23,0.88);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);z-index:99998}



/* QUEUE */
#queue{display:none;border-bottom:1px solid var(--border);flex-shrink:0}
#queue.has{display:block;padding:8px 12px;max-height:100px;overflow-y:auto}
#queue .qtitle{font-size:10px;color:var(--text-muted);text-transform:uppercase;letter-spacing:.5px;margin-bottom:4px}
#queue .item{display:flex;align-items:center;gap:6px;padding:6px 8px;font-size:12px;border-radius:10px;cursor:pointer;margin-bottom:2px}
#queue .item:hover{background:rgba(196,181,253,.08)}
#queue .item.cur{background:rgba(167,139,250,.18);color:var(--accent-2)}
#queue .item .n{color:var(--text-muted);min-width:20px;font-weight:600}
#queue .item.cur .n{color:var(--accent-2)}
#queue .item .t{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* CHAT */
#log{flex:1;overflow-y:auto;padding:10px;font-size:13px;line-height:1.5;display:flex;flex-direction:column;gap:6px;min-height:0;background:rgba(11,8,23,0.25);margin:10px;border-radius:var(--radius-sm);border:1px solid var(--border)}
#log>div{padding:7px 11px;background:rgba(196,181,253,0.06);border-radius:var(--radius-sm);border:1px solid rgba(196,181,253,0.08);word-wrap:break-word}
#log>div.sys{background:transparent;border:none;color:var(--text-muted);font-style:italic;font-size:12px;padding:4px 10px;text-align:center}
#log b{color:var(--accent-2);font-weight:600}
#chatForm{display:flex;gap:6px;padding:10px;border-top:1px solid var(--border);background:rgba(11,8,23,0.3);flex-shrink:0;padding-bottom:calc(10px + env(safe-area-inset-bottom, 0px))}
#chatForm input{flex:1;min-width:0;padding:9px 12px;font-size:13px}
#chatForm button{padding:9px 16px;font-size:13px}

/* EMOJIS & SCROLLBAR */
.float{position:absolute;bottom:90px;font-size:40px;pointer-events:none;animation:floatUp 2.6s ease-out forwards;z-index:10;filter:drop-shadow(0 4px 12px rgba(15,8,40,0.6))}
@keyframes floatUp{0%{transform:translateY(0) scale(0.6);opacity:0}15%{opacity:1;transform:translateY(-20px) scale(1)}100%{transform:translateY(-320px) scale(1.1);opacity:0}}
.react{padding:6px 10px;font-size:16px;background:var(--glass-strong)}
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:rgba(196,181,253,0.2);border-radius:4px}

/* THEME SWITCH (dark / light / system) */
.themeRow{display:flex;align-items:center;justify-content:center;gap:8px}
.themeSwitch{display:inline-flex;align-items:center;gap:2px;background:var(--glass);border:1px solid var(--border);border-radius:999px;padding:3px;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
.themeSwitch button{padding:5px 12px;font-size:12px;border:none;background:transparent;border-radius:999px;color:var(--text-muted);box-shadow:none;font-weight:600;white-space:nowrap}
.themeSwitch button:hover{background:var(--glass-strong);transform:none}
.themeSwitch button.on{background:var(--grad);color:#fff;box-shadow:0 2px 10px rgba(108,92,231,0.35)}
#profileCard .themeRow{justify-content:flex-start}
#profileCard .themeSwitch button{padding:4px 9px;font-size:11px}

/* LIGHT THEME — additive overrides; dark (default) is untouched.
   Video wells/player stay dark in both themes (standard for video). */
html:is([data-theme="light"],[data-theme="cute"]){
  color-scheme:light;
  --bg:#F5F2FC;
  --glass:rgba(255,255,255,0.6);
  --glass-strong:rgba(255,255,255,0.82);
  --border:rgba(108,92,231,0.2);
  --text:#251C3F;
  --text-muted:#6E6590;
  --accent:#7C5CE7;
  --accent-2:#5B4BD6;
  --brand:#6C5CE7;
  --danger:#D63A5C;
  --shadow:0 12px 36px rgba(108,92,231,0.16);
  --shadow-soft:0 4px 24px rgba(108,92,231,0.12);
}
html:is([data-theme="light"],[data-theme="cute"]) body{background-image:radial-gradient(circle at 12% 12%,rgba(167,139,250,0.18),transparent 46%),radial-gradient(circle at 88% 88%,rgba(124,106,239,0.14),transparent 46%),radial-gradient(circle at 50% 50%,rgba(196,181,253,0.25),transparent 72%)}
html:is([data-theme="light"],[data-theme="cute"]) #lobby h1{background:linear-gradient(135deg,#3A2E63 25%,var(--accent));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
html:is([data-theme="light"],[data-theme="cute"]) #bar{background:rgba(255,255,255,0.82)}
html:is([data-theme="light"],[data-theme="cute"]) #videoGrid{background:rgba(108,92,231,0.08)}
html:is([data-theme="light"],[data-theme="cute"]) #log{background:rgba(255,255,255,0.5)}
html:is([data-theme="light"],[data-theme="cute"]) #log>div{background:rgba(108,92,231,0.07);border-color:rgba(108,92,231,0.12)}
html:is([data-theme="light"],[data-theme="cute"]) #chatForm{background:rgba(255,255,255,0.6)}
html:is([data-theme="light"],[data-theme="cute"]) #progWrap{background:rgba(108,92,231,0.15)}
html:is([data-theme="light"],[data-theme="cute"]) #profileCard{background:rgba(108,92,231,0.07)}
html:is([data-theme="light"],[data-theme="cute"]) ::-webkit-scrollbar-thumb{background:rgba(108,92,231,0.3)}
html:is([data-theme="light"],[data-theme="cute"]) button:hover{background:rgba(108,92,231,0.14)}
html:is([data-theme="light"],[data-theme="cute"]) .lobby-status.ok{color:#1E9E5A}
html:is([data-theme="light"],[data-theme="cute"]) .lobby-status.error{color:#D63A5C}
html:is([data-theme="light"],[data-theme="cute"]) .call-status.ok{color:#1E9E5A}
html:is([data-theme="light"],[data-theme="cute"]) .call-status.warn{color:#B26A00}

/* CUTE THEME — pastel "strawberry milk" test theme (reversible via theme switch) */
html[data-theme="cute"]{
  color-scheme:light;
  --bg:#FFF4F8;
  --glass:rgba(255,255,255,0.7);
  --glass-strong:rgba(255,255,255,0.9);
  --border:rgba(247,108,138,0.25);
  --text:#5C4652;
  --text-muted:#A88795;
  --accent:#F76C8A;
  --accent-2:#E0567A;
  --brand:#F76C8A;
  --danger:#E0567A;
  --radius-sm:18px;
  --radius:26px;
  --radius-lg:34px;
  --shadow:0 12px 36px rgba(247,108,138,0.18);
  --shadow-soft:0 4px 24px rgba(247,108,138,0.14);
  --grad:linear-gradient(135deg,#FF9FB8 0%,#F76C8A 55%,#E0567A 100%);
  --font:ui-rounded,'Hiragino Maru Gothic ProN','Quicksand','Comfortaa','SamsungOne','Inter',system-ui,sans-serif;
}
html[data-theme="cute"] body{background-image:radial-gradient(circle at 10% 12%,rgba(255,159,184,0.25),transparent 40%),radial-gradient(circle at 90% 85%,rgba(159,224,201,0.25),transparent 42%),radial-gradient(rgba(247,108,138,0.10) 1.5px,transparent 1.6px);background-size:auto,auto,22px 22px}
html[data-theme="cute"] #lobby{border-radius:40px}
html[data-theme="cute"] #lobby h1{background:linear-gradient(135deg,#E0567A 20%,#F79BB4);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
html[data-theme="cute"] button,html[data-theme="cute"] input{border-radius:999px}
html[data-theme="cute"] #side,html[data-theme="cute"] #stage{border-radius:32px}
html[data-theme="cute"] .camBox{border-radius:24px}
html[data-theme="cute"] #log{border-radius:22px}
.cuteOnly{display:none}
html[data-theme="cute"] .cuteOnly{display:block}
.cuteMascot{font-size:44px;line-height:1;filter:drop-shadow(0 4px 10px rgba(247,108,138,0.35));animation:bob 3s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}

/* RESPONSIVE */
@media (max-width: 900px) or (orientation: portrait){
#app{grid-template-columns:1fr;grid-template-rows:38dvh 1fr;gap:10px;padding:10px}
#bar{padding:6px 8px}
#bar input[type="text"]{min-width:80px}
#lobby{margin:8vh auto;padding:26px}
}

</style>
</head>
<body>

<div id="lobby">
<div class="cuteOnly cuteMascot" aria-hidden="true">🐰</div>
<h1>🎬 Together</h1>
<p id="lobbyStatus" class="lobby-status">Connecting to server…</p>
<input id="name" placeholder="Your name (optional)">
<button id="create" disabled>Create a room</button>
<input id="codeIn" placeholder="Room code">
<button id="join" disabled>Join room</button>
<div class="themeRow"><div class="themeSwitch" role="group" aria-label="Theme">
<button type="button" data-theme-choice="dark" title="Dark theme">🌙 Dark</button>
<button type="button" data-theme-choice="light" title="Light theme">☀️ Light</button>
<button type="button" data-theme-choice="system" title="Follow system theme">🖥 System</button>
<button type="button" data-theme-choice="cute" title="Cute theme">🌸 Cute</button>
</div></div>
</div>

<div id="app">
<div id="stage">
<div id="views">
<video id="player" controls controlsList="nodownload" playsinline></video>
<video id="screen" autoplay playsinline controls></video>
<div id="ytWrap"><div id="ytPlayer"></div><div id="ytUnlock">▶ Tap to play together</div></div>
</div>

<div id="bar">
<input type="file" id="upFile" accept="video/*,.mkv">
<button id="pickBtn">📁 Choose</button>
<span id="fileName"></span>
<button id="upBtn" disabled>⬆ Upload</button>
<button id="delBtn">🗑 Delete</button>
<span id="upStatus"></span>
<input type="text" id="urlIn" placeholder="Video URL (.mp4 / .m3u8 / YouTube)">
<button id="loadUrl">Load</button>
<button id="mic">🎤 Mic</button>
<button id="cam">📷 Cam</button>
<button id="share">🖥 Share</button>
<button id="syncBtn">⟲ Sync</button>
<button id="copy">🔗 Invite</button>
<button id="callSpeakerBtn" title="Call audio: Speaker">🔊 Call</button>
<button class="react">❤️</button>
<button class="react">😂</button>
<button class="react">😮</button>
<button class="react">👏</button>
<div id="progWrap"><div id="progBar"></div></div>
</div>
</div>

<div id="side">
<div id="profileCard">
<div class="nameRow"><span class="nameLabel">You:</span><input id="myNameInput" placeholder="Your name" maxlength="20"><button id="saveName" title="Save">✓</button><button id="anonName" title="Anonymous">🕶</button></div>
<div class="nameRow"><span class="nameLabel">Partner:</span><span id="peerName">—</span></div>
<div class="nameRow themeRow"><span class="nameLabel">Theme:</span><div class="themeSwitch" role="group" aria-label="Theme">
<button type="button" data-theme-choice="dark" title="Dark theme">🌙</button>
<button type="button" data-theme-choice="light" title="Light theme">☀️</button>
<button type="button" data-theme-choice="system" title="Follow system theme">🖥</button>
<button type="button" data-theme-choice="cute" title="Cute theme">🌸</button>
</div></div>
</div>

<!-- DUAL VIDEO CALLS (Partitioned) -->
<div id="callStatus" class="call-status">Waiting for partner…</div>
<div id="videoGrid">
    <div class="camBox" id="boxMe">
        <video id="me" autoplay muted playsinline></video>
        <div class="camLabel">You</div>
        <div class="camControls">
            <button class="btnToggleMax" data-cam="me">Max</button>
            <button class="btnHide" data-cam="me">Hide</button>
        </div>
    </div>
    <div class="camBox" id="boxThem">
        <video id="them" autoplay playsinline></video>
        <div class="camLabel">Partner</div>
        <div class="camControls">
            <button class="btnToggleMax" data-cam="them">Max</button>
            <button class="btnHide" data-cam="them">Hide</button>
        </div>
    </div>
</div>

<div id="queue"></div>
<div id="log"></div>
<form id="chatForm"><input id="msg" placeholder="Message..." autocomplete="off"><button>Send</button></form>
</div>
</div>

<!-- BACKDROP FOR MAXIMIZED -->
<div id="maxBackdrop" onclick="minimizeAllCams()"></div>

// THEME: dark / light / system, persisted per device; "system" follows the OS live.
const THEME_KEY='together-theme';
const themeMQ=window.matchMedia?window.matchMedia('(prefers-color-scheme: dark)'):null;
let themePref='cute';
try{const s=localStorage.getItem(THEME_KEY);if(s==='dark'||s==='light'||s==='system'||s==='cute')themePref=s;}catch(_){}
function systemDark(){
// In the Android app, prefer the native night-mode bridge; elsewhere use the OS media query.
if(window.AndroidTheme&&typeof window.AndroidTheme.isNightMode==='function'){try{return !!window.AndroidTheme.isNightMode();}catch(_){}}
return !!(themeMQ&&themeMQ.matches);
}
function effectiveTheme(){if(themePref==='cute')return 'cute';if(themePref==='dark')return 'dark';if(themePref==='light')return 'light';return systemDark()?'dark':'light';}
function renderTheme(){
document.documentElement.setAttribute('data-theme',effectiveTheme());
document.querySelectorAll('[data-theme-choice]').forEach(b=>{const on=b.getAttribute('data-theme-choice')===themePref;b.classList.toggle('on',on);b.setAttribute('aria-pressed',on?'true':'false');});
}
function setThemePref(p){themePref=p;try{localStorage.setItem(THEME_KEY,p);}catch(_){}renderTheme();}
if(themeMQ){const onSys=()=>{if(themePref==='system')renderTheme();};if(themeMQ.addEventListener)themeMQ.addEventListener('change',onSys);else if(themeMQ.addListener)themeMQ.addListener(onSys);}
// Re-check "system" when returning to the app/tab (user may have flipped OS dark mode).
const refreshSystemTheme=()=>{if(themePref==='system')renderTheme();};
document.addEventListener('visibilitychange',refreshSystemTheme);
window.addEventListener('focus',refreshSystemTheme);
window.addEventListener('pageshow',refreshSystemTheme);
setInterval(()=>{if(themePref==='system'&&window.AndroidTheme)renderTheme();},5000);
document.addEventListener('click',(e)=>{const b=e.target.closest('[data-theme-choice]');if(b)setThemePref(b.getAttribute('data-theme-choice'));});
renderTheme();

// INDIVIDUAL CAMERA CONTROLS
// NOTE: #side has backdrop-filter, which traps position:fixed descendants.
// So a maximized camBox is moved to <body> and restored to #videoGrid on exit.
function minimizeAllCams() {
    document.querySelectorAll('.camBox').forEach(b => {
        b.classList.remove('maximized', 'pip');
        b.style.left = ''; b.style.top = ''; b.style.right = ''; b.style.bottom = '';
    });
    const grid = $('videoGrid');
    grid.appendChild($('boxMe'));
    grid.appendChild($('boxThem'));
    document.querySelectorAll('.btnToggleMax').forEach(b => b.textContent = 'Max');
    $('maxBackdrop').style.display = 'none';
    document.body.classList.remove('cam-max');
}

function toggleMaxCam(cam) {
    const box = cam === 'me' ? $('boxMe') : $('boxThem');
    const other = cam === 'me' ? $('boxThem') : $('boxMe');
    if (box.classList.contains('maximized')) { minimizeAllCams(); return; }
    minimizeAllCams();
    document.body.appendChild(box);
    box.classList.add('maximized');
    const btn = box.querySelector('.btnToggleMax');
    if (btn) btn.textContent = 'Exit';
    // Picture-in-picture: the other camera floats in a corner of the maximized view
    document.body.appendChild(other);
    other.classList.add('pip');
    $('maxBackdrop').style.display = 'block';
    document.body.classList.add('cam-max');
}

document.querySelectorAll('.btnToggleMax').forEach(btn => {
    btn.onclick = (e) => {
        e.stopPropagation();
        toggleMaxCam(e.target.dataset.cam);
    };
});

// Double-click / double-tap a grid camera to maximize; Esc or backdrop tap to exit.
// The floating PiP tile is handled separately (drag to move, tap to swap).
document.querySelectorAll('.camBox').forEach(box => {
    const cam = box.id === 'boxMe' ? 'me' : 'them';
    box.addEventListener('dblclick', (e) => {
        if (box.classList.contains('pip')) return;
        if (e.target.closest('.camControls')) return;
        toggleMaxCam(cam);
    });
    let lastTap = 0;
    box.addEventListener('touchend', (e) => {
        if (box.classList.contains('pip')) return;
        if (e.target.closest('.camControls')) return;
        const now = Date.now();
        if (now - lastTap < 350) { e.preventDefault(); toggleMaxCam(cam); }
        lastTap = now;
    });

    // PiP: drag to reposition anywhere on screen; a simple tap swaps which camera is big.
    let dragging = false, moved = false, sx = 0, sy = 0, ox = 0, oy = 0;
    box.addEventListener('pointerdown', (e) => {
        if (!box.classList.contains('pip')) return;
        dragging = true; moved = false;
        sx = e.clientX; sy = e.clientY;
        const r = box.getBoundingClientRect();
        ox = r.left; oy = r.top;
        if (box.setPointerCapture) { try { box.setPointerCapture(e.pointerId); } catch (_) {} }
    });
    box.addEventListener('pointermove', (e) => {
        if (!dragging || !box.classList.contains('pip')) return;
        const dx = e.clientX - sx, dy = e.clientY - sy;
        if (Math.abs(dx) > 6 || Math.abs(dy) > 6) moved = true;
        if (!moved) return;
        const r = box.getBoundingClientRect();
        const nx = Math.max(4, Math.min(window.innerWidth - r.width - 4, ox + dx));
        const ny = Math.max(4, Math.min(window.innerHeight - r.height - 4, oy + dy));
        box.style.left = nx + 'px'; box.style.top = ny + 'px';
        box.style.right = 'auto'; box.style.bottom = 'auto';
    });
    box.addEventListener('pointerup', () => {
        if (!dragging) return;
        dragging = false;
        if (box.classList.contains('pip') && !moved) toggleMaxCam(cam);
    });
    box.addEventListener('pointercancel', () => { dragging = false; });
});

function joinRoom(code,create){
return new Promise((resolve,reject)=>{
if(!socket.connected)return reject(new Error('Not connected to server yet.'));
socket.timeout(8000).emit('join',{room:code,create,cid},(err,res)=>{
if(err)return reject(new Error('Server did not answer. Is the Termux server running?'));
if(!res)return reject(new Error('Empty server response.'));
if(res.error)return reject(new Error(res.error));
resolve(res);
});
});
}

async function enter(code,create){
if(joining)return;
code=String(code||'').trim().toUpperCase();
if(!/^[A-Z0-9]{4,12}$/.test(code))return setLobbyStatus('Enter a 4–12 letter/number room code.','error');
myName=$('name').value.trim()||anonId;
joining=true;setBusy(true);
setLobbyStatus(create?'Creating room…':'Joining room…');
try{
const res=await joinRoom(code,create);
room=code;
$('lobby').style.display='none';
$('app').style.display='grid';
if(window.AndroidSpeaker)window.AndroidSpeaker.setSpeakerOn(true);
forceSpeakerRoute();
if(res.peerName){const pn=$('peerName');if(pn)pn.textContent=res.peerName}
$('myNameInput').value=myName;
socket.emit('set-name',{name:myName});
if(res.url){
loadSource(res.url);addSubs(res.subs);
if(!playlist.some(p=>p.url===res.url)){
playlist.push({url:res.url,subs:res.subs,name:'Current video'});
currentIdx=0;
renderQueue();
}
}
sys('Room '+code+(res.created?' created':' joined')+'. Waiting for your partner...');
try{history.replaceState({},'','?room='+code)}catch(e){}
ensureLocalMedia();
}catch(err){
setLobbyStatus(err.message||'Could not enter room.','error');
}finally{
joining=false;setBusy(false);
}
}

async function ensureLocalMedia(){
if(localStream){$('me').srcObject=localStream;syncLocalTracks();return}
if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){
sys('Camera/mic is not available in this browser. You can still watch and chat.');
return;
}
try{
localStream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true,autoGainControl:true},video:{facingMode:{ideal:'user'},width:{ideal:1280},height:{ideal:720}}});
}catch(e){
try{localStream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true,autoGainControl:true}})}
catch(e2){localStream=null}
}
if(localStream){$('me').srcObject=localStream;syncLocalTracks()}
else sys('Camera/mic permission was denied or unavailable. You can still watch and chat.');
}

function syncLocalTracks(){
if(!pc||!localStream)return;
localStream.getTracks().forEach(track=>{
const tr=pc.getTransceivers().find(t=>t.receiver&&t.receiver.track&&t.receiver.track.kind===track.kind);
if(tr){
if(tr.sender.track!==track)tr.sender.replaceTrack(track).catch(()=>{});
try{tr.direction='sendrecv'}catch(e){}
}else{
pc.addTrack(track,localStream);
}
});
}

// ---- YouTube synced playback ----
function parseYouTube(u){
try{
const url=new URL(u);
const h=url.hostname.replace(/^www\./,'');
let id=null;
if(h==='youtu.be')id=url.pathname.slice(1).split('/')[0];
else if(h==='youtube.com'||h==='m.youtube.com'||h==='music.youtube.com'){
if(url.pathname==='/watch')id=url.searchParams.get('v');
else{const m=url.pathname.match(/^\/(embed|shorts|live|v)\/([A-Za-z0-9_-]{11})/);if(m)id=m[2];}
}
return (id&&/^[A-Za-z0-9_-]{11}$/.test(id))?id:null;
}catch(_){return null}
}
function loadYouTubeApi(cb){
if(window.YT&&YT.Player)return cb();
ytApiCallbacks.push(cb);
if(ytApiLoading)return;
ytApiLoading=true;
window.onYouTubeIframeAPIReady=()=>{ytApiCallbacks.splice(0).forEach(f=>f());};
const s=document.createElement('script');
s.src='https://www.youtube.com/iframe_api';
s.onerror=()=>sys('Could not load the YouTube player (check internet).');
document.head.appendChild(s);
}
function ytTime(){return (yt&&ytReady&&yt.getCurrentTime)?yt.getCurrentTime():0}
function ytPaused(){return !(yt&&ytReady&&yt.getPlayerState&&window.YT&&yt.getPlayerState()===YT.PlayerState.PLAYING)}
function mediaTime(){return ytMode?ytTime():video.currentTime}
function mediaPlaying(){return ytMode?!ytPaused():!video.paused}
const sendYt=(type)=>{if(!remote&&ytMode)socket.emit('player',{type,time:ytTime()})};
function ytPlay(){
if(!yt)return;
try{yt.playVideo()}catch(_){}
setTimeout(()=>{if(ytMode&&yt&&yt.getPlayerState&&window.YT&&yt.getPlayerState()!==YT.PlayerState.PLAYING)$('ytUnlock').style.display='flex';},1200);
}
function onYtState(ev){
const S=window.YT&&YT.PlayerState;if(!S)return;
if(ev.data===S.PLAYING){$('ytUnlock').style.display='none';sendYt('play');sendYt('ready');}
else if(ev.data===S.PAUSED)sendYt('pause');
else if(ev.data===S.BUFFERING)sendYt('buffering');
}
function stopYouTube(){
ytMode=false;ytReady=false;
if(yt){try{yt.destroy()}catch(_){}yt=null;}
$('ytPlayer').innerHTML='';
$('ytWrap').style.display='none';
$('ytUnlock').style.display='none';
}
function showYouTube(videoId,startTime,autoplay){
stopYouTube();
ytMode=true;
$('ytWrap').style.display='block';
video.style.display='none';
try{video.pause()}catch(_){}
if(hls){hls.destroy();hls=null}
loadYouTubeApi(()=>{
const mount=document.createElement('div');mount.id='ytMount';
$('ytPlayer').innerHTML='';$('ytPlayer').appendChild(mount);
yt=new YT.Player('ytMount',{
videoId,
playerVars:{playsinline:1,rel:0,controls:1,autoplay:autoplay?1:0,start:Math.max(0,Math.floor(startTime||0))},
events:{
onReady:(e)=>{ytReady=true;if(startTime>1)e.target.seekTo(startTime,true);if(autoplay)ytPlay();},
onStateChange:onYtState,
onError:()=>sys('YouTube playback error (video may be restricted or unavailable).')
}
});
});
}
$('ytUnlock').onclick=()=>{if(yt){try{yt.unMute();yt.playVideo()}catch(_){}}$('ytUnlock').style.display='none';};
function pushPlaylist(item){
const i=playlist.findIndex(p=>p.url===item.url);
if(i>=0)currentIdx=i;else{playlist.push(item);currentIdx=playlist.length-1;}
renderQueue();
}
function addSubs(url){
video.querySelectorAll('track').forEach(t=>t.remove());
if(!url)return;
const t=document.createElement('track');
t.kind='subtitles';t.label='Subtitles';t.src=url;t.default=true;
video.appendChild(t);
}
$('loadUrl').onclick=()=>{
const url=$('urlIn').value.trim();
if(!url)return;
const yid=parseYouTube(url);
if(yid){
showYouTube(yid,0,true);
pushPlaylist({url,kind:'youtube',videoId:yid,name:'YouTube • '+yid});
socket.emit('player',{type:'load',kind:'youtube',videoId:yid,url,time:0});
sys('You loaded a YouTube video — partner will play it too');
return;
}
loadSource(url);addSubs(null);
socket.emit('player',{type:'load',url,subs:null});
sys('You loaded a video');
};
const send=(type)=>{if(!remote&&!ytMode)socket.emit('player',{type,time:video.currentTime})};
video.addEventListener('play',()=>send('play'));
video.addEventListener('pause',()=>send('pause'));
video.addEventListener('seeked',()=>send('seek'));
video.addEventListener('waiting',()=>{if(!remote)socket.emit('player',{type:'buffering'})});
video.addEventListener('playing',()=>{if(!remote)socket.emit('player',{type:'ready'})});
$('syncBtn').onclick=()=>{socket.emit('player',{type:'seek',time:mediaTime()});sys('Synced partner to your position')};

socket.on('player',({type,time,url,subs,kind,videoId})=>{
if(type==='load'){
if(kind==='youtube'&&videoId){
showYouTube(videoId,time||0,false);
pushPlaylist({url:url||('https://youtu.be/'+videoId),kind:'youtube',videoId,name:'YouTube • '+videoId});
sys('Partner loaded a YouTube video');
return;
}
const wasUpload=uploadInProgress;
const capturedName=($('fileName')&&$('fileName').textContent)||'';
loadSource(url);addSubs(subs);sys('A video was loaded');
if(uploadInProgress){uploadInProgress=false;resetUploadUI()}
if(url&&!playlist.some(p=>p.url===url)){
const clean=capturedName.replace(/\s*\(.*\)$/,'').trim()||('Episode '+(playlist.length+1));
playlist.push({url,subs,name:clean});
currentIdx=playlist.length-1;
if(wasUpload)socket.emit('queue',{action:'set',list:playlist,current:currentIdx});
}else{
const idx=playlist.findIndex(p=>p.url===url);
if(idx>=0){currentIdx=idx;if(wasUpload)socket.emit('queue',{action:'current',idx})}
}
renderQueue();
return;
}
if(type==='delete'){stopYouTube();video.style.display='block';if(hls){hls.destroy();hls=null}video.removeAttribute('src');video.load();playlist=[];currentIdx=-1;renderQueue();sys('The video was deleted.');return}
remote=true;
if(ytMode&&yt){
if(type==='buffering'){resumeAfter=!ytPaused();yt.pauseVideo()}
else if(type==='ready'){if(resumeAfter){yt.playVideo();resumeAfter=false}}
else{
if(time!=null&&Math.abs(ytTime()-time)>(type==='sync'?1.5:0.4))yt.seekTo(time,true);
if(type==='play')ytPlay();
if(type==='pause')yt.pauseVideo();
}
}else{
if(type==='buffering'){resumeAfter=!video.paused;video.pause()}
else if(type==='ready'){if(resumeAfter){video.play().catch(()=>{});resumeAfter=false}}
else{
if(time!=null&&Math.abs(video.currentTime-time)>(type==='sync'?1.5:0.4))video.currentTime=time;
if(type==='play')video.play().catch(()=>sys('Tap the video once to allow playback'));
if(type==='pause')video.pause();
}
}
setTimeout(()=>(remote=false),700);
});

socket.on('queue',(msg)=>{
if(msg.action==='set'){playlist=msg.list||[];currentIdx=msg.current??-1;renderQueue()}
else if(msg.action==='current'){currentIdx=msg.idx;renderQueue()}
});

setInterval(()=>{
if(pc&&!polite&&mediaPlaying())socket.emit('player',{type:'sync',time:mediaTime()});
},5000);

function fmtSize(b){if(b<1024)return b+' B';if(b<1048576)return (b/1024).toFixed(1)+' KB';if(b<1073741824)return (b/1048576).toFixed(1)+' MB';return (b/1073741824).toFixed(2)+' GB'}
function resetUploadUI(){
$('progWrap').style.display='none';
$('progBar').style.width='0%';
$('upBtn').disabled=true;
$('pickBtn').disabled=false;
$('upFile').value='';
$('fileName').textContent='';
$('upStatus').textContent='';
}
$('pickBtn').onclick=()=>{$('upFile').value='';$('upFile').click()};
$('upFile').onchange=()=>{
const f=$('upFile').files[0];
if(!f){$('fileName').textContent='';$('upBtn').disabled=true;return}
$('fileName').textContent=f.name+' ('+fmtSize(f.size)+')';
$('upBtn').disabled=false;
$('upStatus').textContent='Ready to upload';
};
$('upBtn').onclick=()=>{
if(!room)return;
const f=$('upFile').files[0];
if(!f)return alert('Choose a file first');
uploadInProgress=true;
$('upBtn').disabled=true;
$('pickBtn').disabled=true;
$('progWrap').style.display='block';
$('progBar').style.width='0%';
$('upStatus').textContent='Uploading 0%';
const fd=new FormData();fd.append('video',f);
const xhr=new XMLHttpRequest();
xhr.open('POST','/upload/'+room);
xhr.upload.onprogress=(e)=>{
if(!e.lengthComputable)return;
const pct=Math.round((e.loaded/e.total)*100);
$('progBar').style.width=pct+'%';
$('upStatus').textContent='Uploading '+pct+'%';
};
xhr.onload=()=>{
if(xhr.status===200){$('upStatus').textContent='Converting on server...'}
else{uploadInProgress=false;$('upStatus').textContent='Upload rejected';$('progWrap').style.display='none';$('upBtn').disabled=false;$('pickBtn').disabled=false}
};
xhr.onerror=()=>{
uploadInProgress=false;
$('upStatus').textContent='Upload failed.';
$('progWrap').style.display='none';
$('upBtn').disabled=false;
$('pickBtn').disabled=false;
};
xhr.send(fd);
};
socket.on('processing',({name,percent})=>{
if(percent<0){uploadInProgress=false;$('upStatus').textContent='Conversion failed';$('progWrap').style.display='none';$('upBtn').disabled=false;$('pickBtn').disabled=false;return}
if(percent>=99){$('upStatus').textContent='Finishing...';$('progBar').style.width='100%';return}
$('progWrap').style.display='block';
$('progBar').style.width=percent+'%';
$('upStatus').textContent='Converting "'+name+'" '+percent+'%';
});

$('delBtn').onclick=()=>{
if(!room)return;
if(!confirm('Remove the current video for both of you?'))return;
fetch('/delete/'+room,{method:'DELETE'}).then(r=>r.json()).then(d=>{if(d.error)sys(d.error)}).catch(()=>sys('Delete failed.'));
};

function addLine(html,cls){
const d=document.createElement('div');
if(cls)d.className=cls;
d.innerHTML=html;
$('log').appendChild(d);
$('log').scrollTop=1e9;
}
const esc=(t)=>String(t).replace(/[&<>"]/g,(c)=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const sys=(t)=>addLine(esc(t),'sys');
$('chatForm').onsubmit=(e)=>{
e.preventDefault();
const text=$('msg').value.trim();if(!text)return;
socket.emit('chat',{name:myName,text});
addLine('<b>You:</b> '+esc(text));
$('msg').value='';
};
socket.on('chat',({name,text})=>addLine('<b>'+esc(name)+':</b> '+esc(text)));

socket.on('ready',({polite:p})=>{sys('Partner connected 🎉');createPeer(p);syncLocalTracks();socket.emit('set-name',{name:myName});setTimeout(()=>applyCallSpeaker(true),500);setTimeout(()=>applyCallSpeaker(true),2000)});
socket.on('peer-left',()=>{
sys('Partner left (they may be reconnecting)');
setCallStatus('closed');
if(pc)pc.close();
pc=null;
$('them').srcObject=null;
hideScreen();
});
function createPeer(p){
if(pc)pc.close();
polite=p;makingOffer=false;ignoreOffer=false;remoteScreenId=null;
pc=new RTCPeerConnection(ICE);
setCallStatus('checking');
pc.onconnectionstatechange=()=>setCallStatus(pc.connectionState);
pc.oniceconnectionstatechange=()=>{if(pc.iceConnectionState==='failed'){try{pc.restartIce()}catch(e){}}setCallStatus(pc.iceConnectionState)};
if(localStream)localStream.getTracks().forEach(t=>pc.addTrack(t,localStream));
else{pc.addTransceiver('audio',{direction:'sendrecv'});pc.addTransceiver('video',{direction:'sendrecv'})}
pc.ontrack=(e)=>{
const stream=e.streams[0];
if(stream&&stream.id===remoteScreenId){
$('screen').srcObject=stream;
$('screen').style.display='block';
video.style.display='none';
$('ytWrap').style.display='none';
}else{
$('them').srcObject=stream||new MediaStream([e.track]);
try{routeStreamToSpeaker($('them').srcObject)}catch(e){}
forceSpeakerRoute();
}
};
pc.onicecandidate=({candidate})=>candidate&&socket.emit('signal',{candidate});
pc.onnegotiationneeded=async()=>{
try{makingOffer=true;await pc.setLocalDescription();socket.emit('signal',{description:pc.localDescription})}
catch(err){console.error(err)}
finally{makingOffer=false}
};
}
socket.on('signal',async({description,candidate})=>{
if(!pc)return;
try{
if(description){
const collision=description.type==='offer'&&(makingOffer||pc.signalingState!=='stable');
ignoreOffer=!polite&&collision;
if(ignoreOffer)return;
await pc.setRemoteDescription(description);
if(description.type==='offer'){await pc.setLocalDescription();socket.emit('signal',{description:pc.localDescription})}
}else if(candidate){
try{await pc.addIceCandidate(candidate)}catch(e){if(!ignoreOffer)throw e}
}
}catch(err){console.error(err)}
});
function toggle(kind,btn,label){
const t=localStream&&localStream.getTracks().find(x=>x.kind===kind);
if(!t)return alert('No '+kind+' available');
t.enabled=!t.enabled;
btn.classList.toggle('on',!t.enabled);
btn.textContent=(t.enabled?'':'🚫 ')+label;
}
$('mic').onclick=()=>toggle('audio',$('mic'),'🎤 Mic');
$('cam').onclick=()=>toggle('video',$('cam'),'📷 Cam');
$('share').onclick=async()=>{
if(screenStream)return stopScreen();
if(!pc)return alert('Wait until your partner joins');
if(!navigator.mediaDevices.getDisplayMedia)return alert('Screen sharing not supported on this device.');
try{screenStream=await navigator.mediaDevices.getDisplayMedia({video:true,audio:true})}catch{return}
socket.emit('screen-start',{streamId:screenStream.id});
screenStream.getTracks().forEach(t=>screenSenders.push(pc.addTrack(t,screenStream)));
screenStream.getVideoTracks()[0].onended=stopScreen;
$('share').classList.add('on');$('share').textContent='⏹ Stop';
};
function stopScreen(){
if(!screenStream)return;
screenSenders.forEach(s=>{try{pc.removeTrack(s)}catch{}});
screenSenders=[];
screenStream.getTracks().forEach(t=>t.stop());
screenStream=null;
socket.emit('screen-stop');
$('share').classList.remove('on');$('share').textContent='🖥 Share';
}
socket.on('screen-start',({streamId})=>{remoteScreenId=streamId;sys('Partner is sharing their screen')});
socket.on('screen-stop',()=>{remoteScreenId=null;hideScreen();sys('Screen share ended')});
function hideScreen(){
$('screen').srcObject=null;
$('screen').style.display='none';
video.style.display=ytMode?'none':'block';
$('ytWrap').style.display=ytMode?'block':'none';
}
function floatEmoji(e){
const d=document.createElement('div');
d.className='float';
d.textContent=e;
d.style.left=(10+Math.random()*80)+'%';
$('stage').appendChild(d);
setTimeout(()=>d.remove(),2600);
}
document.querySelectorAll('.react').forEach(b=>b.onclick=()=>{
floatEmoji(b.textContent);
socket.emit('react',{e:b.textContent});
});
socket.on('react',({e})=>floatEmoji(e));
</script>
</body>
</html>
